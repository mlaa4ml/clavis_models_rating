name: Daily Clavis Rating

on:
  schedule:
    # 07:22 UTC каждый день = 10:22 МСК. Время в cron всегда UTC.
    - cron: '22 7 * * *'
  workflow_dispatch: {}   # позволяет запускать вручную из вкладки Actions

# Нужны права на запись, чтобы workflow мог закоммитить обновлённые
# data/*.csv и README.md обратно в репозиторий.
permissions:
  contents: write

concurrency:
  group: daily-rating
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect model stats
        run: python scripts/collect.py

      - name: Update README rating table
        run: python scripts/update_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --cached --quiet; then
            echo "Нет изменений — коммит не нужен."
          else
            git commit -m "chore: daily rating update ($(date -u +'%Y-%m-%d'))"
            git push
          fi
