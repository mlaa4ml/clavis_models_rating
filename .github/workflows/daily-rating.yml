name: Daily Clavis Rating

on:
  schedule:
    # 06:00 UTC каждый день = 09:00 МСК
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-rating
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Единственный сборщик ───────────────────────────────────────────────
      # collect.py удалён: он делал те же HTTP-запросы, но сохранял меньше
      # полей. collect_extended.py — его полная замена. Если в репозитории
      # ещё остался старый data/history.csv, запусти один раз вручную:
      #   python scripts/migrate_history.py
      # и перенесёшь накопленную историю в extended_history.csv без потерь.
      - name: Collect model stats
        run: python scripts/collect_extended.py

      # ── Потребители данных — читают extended_history.csv ──────────────────
      - name: Update README rating table
        run: python scripts/update_readme.py

      - name: Build extended ratings page (GitHub Pages)
        run: python scripts/build_ratings_page.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md docs/
          if git diff --cached --quiet; then
            echo "Нет изменений — коммит не нужен."
          else
            git commit -m "chore: daily rating update ($(date -u +'%Y-%m-%d'))"
            git push
          fi
